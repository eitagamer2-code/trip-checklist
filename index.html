/* Responsive layout fixes: mobile-first overrides */
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body { min-width: 0; overflow-x: hidden; }
.app, .layout, .panel, #mainPanel, #tabContent, .trip-list, .data-card { min-width: 0; }
img, svg, video, canvas { max-width: 100%; height: auto; }
input, select, textarea, button { max-width: 100%; }
textarea { font: inherit; resize: vertical; }
button { touch-action: manipulation; }
.field { min-width: 0; }
.data-card, .item, .trip-card, .destination, .data-meta, .notice { overflow-wrap: anywhere; }
.detail-head > div { min-width: 0; flex: 1; }
.detail-head h2 { overflow-wrap: anywhere; }
.destination { line-height: 1.65; }
#tabContent { min-width: 0; }
.tabs { max-width: 100%; overscroll-behavior-x: contain; -webkit-overflow-scrolling: touch; scrollbar-width: thin; }
.tabs .tab { flex: 0 0 auto; }
.form-row, .form-row > *, .add-row > * { min-width: 0; }
.modal-back { overflow-y: auto; align-items: flex-start; }
.modal { max-height: calc(100dvh - 36px); overflow-y: auto; }
@media (max-width: 760px) {
  .app { width: 100%; padding: calc(10px + env(safe-area-inset-top)) 10px calc(24px + env(safe-area-inset-bottom)); }
  .top { flex-direction: column; align-items: stretch; gap: 12px; margin-bottom: 14px; }
  .brand { min-width: 0; }
  .brand h1 { font-size: 18px; line-height: 1.25; }
  #newTripBtn { width: 100%; }
  .layout { display: flex; flex-direction: column; gap: 12px; }
  .layout > aside, .layout > main { width: 100%; }
  .panel { padding: 13px; border-radius: 14px; }

  .trip-list { grid-template-columns: 1fr; }
  .trip-card { padding: 12px; }
  .detail-head { align-items: flex-start; gap: 8px; }
  .detail-head h2 { font-size: 21px; line-height: 1.3; }
  .destination { font-size: 13px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin: 14px 0; }
  .stat { min-width: 0; padding: 10px; }
  .stat-value { font-size: clamp(17px, 5vw, 21px); overflow-wrap: anywhere; }
  .tabs { margin: 14px -2px; padding: 0 2px 7px; gap: 6px; }
  .tabs .tab { padding: 9px 11px; font-size: 13px; }
  .form-row { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .form-row .wide { grid-column: auto; }
  .add-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 7px; }
  .add-row input { width: 100%; grid-column: 1 / -1; }
  .add-row select { width: 100%; max-width: none !important; grid-column: 1; }
  .add-row button { grid-column: 2; grid-row: 2; }
  .template-grid { grid-template-columns: minmax(0, 1fr); }
  .template-actions { align-items: stretch; }
  .template-actions button { flex: 1 1 auto; }
  .item { gap: 8px; padding: 10px; }
  .category { white-space: normal; max-width: 35%; }
  .data-card[style*="display:flex"] { flex-wrap: wrap; align-items: flex-start !important; }
  .data-card[style*="display:flex"] > div { min-width: 0; }
  .data-card[style*="display:flex"] .money { overflow-wrap: anywhere; }
  .modal-back { padding: 10px; }
  .modal { width: 100%; padding: 17px; max-height: calc(100dvh - 20px); }
  .modal-actions { flex-wrap: wrap; }
  .modal-actions button { flex: 1 1 120px; }
  .empty { overflow-wrap: anywhere; }
}
@media (max-width: 360px) {
  .app { padding-left: 7px; padding-right: 7px; }

  .add-row { grid-template-columns: minmax(0, 1fr); }
  .add-row input, .add-row select, .add-row button { grid-column: 1; grid-row: auto; }
}


/* Date fields: prevent iOS date controls from overflowing grid cells */
*, *::before, *::after { box-sizing: border-box; }
.form-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.form-row > .field, .form-row > label, .field[type="date"], .field[type="time"] { width: 100%; min-width: 0; max-width: 100%; }
input[type="date"], input[type="time"] { display: block; min-width: 0; width: 100%; max-width: 100%; padding-right: 6px; font-size: 16px; }
.photo-diary-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 190px), 1fr)); gap: 12px; margin-top: 14px; }
.diary-card { min-width: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 13px; background: #fff; }
.diary-card img { display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover; background: #f0f3f0; }
.diary-card-body { padding: 11px; min-width: 0; }
.diary-card-body p { margin: 7px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; line-height: 1.55; }
.diary-actions { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-top: 10px; }
.photo-preview { display: block; max-width: 100%; max-height: 240px; object-fit: contain; border-radius: 10px; margin-top: 8px; }
@media (max-width: 760px) {
  .form-row { grid-template-columns: minmax(0, 1fr); }
  .form-row .wide { grid-column: auto; }
  #schDate, #schTime, #expDate { width: 100%; min-width: 0; }
  .photo-diary-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
}
@media (max-width: 360px) {
  .photo-diary-grid { grid-template-columns: minmax(0, 1fr); }
}

<body>
<div class="app">
<header class="top">
 <div class="brand"><div class="logo">🧳</div><div><h1>Trip Checklist</h1><p>旅行の準備を、もっとシンプルに。</p></div></div>
 <button class="primary" id="newTripBtn">＋ 旅行を追加</button>
</header>
<div class="layout">
 <aside class="panel">
  <div class="section-head"><h2>旅行一覧</h2><span id="tripCount" class="trip-meta">0件</span></div>
  <div class="trip-list" id="tripList"></div>
  <p class="notice">旅行データとチェック状況は、このブラウザ内に自動保存されます。</p>
 </aside>
 <main class="panel" id="mainPanel"></main>
</div>
</div>
<div class="modal-back" id="tripModal">
 <div class="modal">
  <h2 id="modalTitle">旅行を追加</h2>
  <form id="tripForm">
   <div class="form-grid">
    <label>旅行名<input class="field" id="tripName" placeholder="例：四国 2泊3日旅行" required maxlength="80"></label>
    <label>行き先<input class="field" id="tripDestination" placeholder="例：香川・愛媛"></label>
    <label>出発日<input class="field" id="tripStart" type="date"></label>
    <label>帰宅日<input class="field" id="tripEnd" type="date"></label>
    <label>テンプレートから作成<select class="field" id="tripTemplate"><option value="">空のリストで作成</option></select></label>
   </div>
   <div class="modal-actions"><button type="button" class="plain" id="cancelTrip">キャンセル</button><button class="primary" type="submit">保存する</button></div>
  </form>
 </div>
</div>
<script>
const KEY='trip-checklist-v1';
const starterTemplates=[
 {id:'tpl-domestic',name:'国内旅行の基本',items:[
  ['財布・現金','貴重品'],['身分証明書','貴重品'],['スマートフォン','電子機器'],['充電器・ケーブル','電子機器'],['モバイルバッテリー','電子機器'],['着替え','衣類'],['下着・靴下','衣類'],['洗面用具','洗面・ケア'],['常備薬','その他'],['予約情報・チケット','貴重品'],['イヤホン','電子機器']
 ]},
 {id:'tpl-overseas',name:'海外旅行の基本',items:[
  ['パスポート','貴重品'],['航空券・予約情報','貴重品'],['財布・現地通貨','貴重品'],['クレジットカード','貴重品'],['海外旅行保険情報','貴重品'],['スマートフォン','電子機器'],['変換プラグ','電子機器'],['充電器・ケーブル','電子機器'],['モバイルバッテリー','電子機器'],['着替え','衣類'],['洗面用具','洗面・ケア'],['常備薬','その他']
 ]},
 {id:'tpl-camp',name:'キャンプ・アウトドア',items:[
  ['テント・ペグ','キャンプ用品'],['寝袋・マット','キャンプ用品'],['ランタン・電池','キャンプ用品'],['調理器具','キャンプ用品'],['食材・飲み物','食事'],['着替え・防寒着','衣類'],['雨具','衣類'],['タオル','洗面・ケア'],['虫よけ','洗面・ケア'],['救急セット','その他'],['モバイルバッテリー','電子機器']
 ]}
];
let data=loadData(),selectedId=data.trips[0]?.id||null,activeTab='items',filter='all',editingId=null;
function uid(){return 'id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2,7)}
function loadData(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.trips)&&Array.isArray(d.templates)){d.trips.forEach(t=>{if(!Array.isArray(t.items))t.items=[];if(!Array.isArray(t.schedule))t.schedule=[];if(!Array.isArray(t.expenses))t.expenses=[];if(!Array.isArray(t.places))t.places=[];if(!Array.isArray(t.diary))t.diary=[];if(!t.review)t.review={rating:0,text:''};if(typeof t.budget!=='number')t.budget=Number(t.budget)||0});return d}}catch(e){}return {trips:[],templates:starterTemplates.map(t=>({...t,items:t.items.map(([name,category])=>({id:uid(),name,category}))}))}}
function save(){localStorage.setItem(KEY,JSON.stringify(data));render()}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function progress(t){let total=t.items.length,done=t.items.filter(i=>i.checked).length;return {total,done,pct:total?Math.round(done/total*100):0}}
function dateRange(t){if(!t.start&&!t.end)return '日程未設定';return `${t.start||'未定'} ～ ${t.end||'未定'}`}
function render(){renderTrips();renderMain();document.getElementById('tripCount').textContent=data.trips.length+'件'}
function renderTrips(){let el=document.getElementById('tripList');if(!data.trips.length){el.innerHTML='<div class="empty">まだ旅行がありません。<br>「旅行を追加」から最初の旅行を作成しましょう。</div>';return}
 el.innerHTML=data.trips.map(t=>{let p=progress(t);return `<button class="trip-card ${t.id===selectedId?'active':''}" data-trip="${t.id}"><div class="trip-name">${esc(t.name)}</div><div class="trip-meta">📍 ${esc(t.destination||'行き先未設定')}</div><div class="trip-meta" style="margin-top:4px">${esc(dateRange(t))}</div><div class="mini-progress"><span style="width:${p.pct}%"></span></div><div class="trip-meta" style="margin-top:5px">準備 ${p.done}/${p.total} ・ ${p.pct}%</div></button>`}).join('');
 el.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>{selectedId=b.dataset.trip;activeTab='items';render()})}
function renderMain(){let el=document.getElementById('mainPanel'),t=data.trips.find(x=>x.id===selectedId);if(!t){el.innerHTML='<div class="empty" style="padding:36px 12px;text-align:center"><div style="font-size:42px;margin-bottom:12px">🧳</div><h2 style="color:var(--ink)">次の旅行の準備を始めましょう</h2><p>旅行を追加すると、持ち物チェックリストを管理できます。</p><button class="primary" onclick="openTripModal()">＋ 旅行を追加</button></div>';return}
 let p=progress(t);el.innerHTML=`
 <div class="detail-head"><div><div class="eyebrow">MY TRIP</div><h2>${esc(t.name)}</h2><div class="destination">📍 ${esc(t.destination||'行き先未設定')}　 ·　 ${esc(dateRange(t))}</div></div><button class="plain small" id="editTrip">編集</button></div>

 <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px">${[['all','すべて'],['todo','未準備'],['done','準備済み']].map(([v,l])=>`<button class="tab ${filter===v?'active':''}" data-filter="${v}">${l}</button>`).join('')}</div>

 host.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderMain()});
 host.querySelector('#saveTemplate').onclick=()=>{let name=prompt('テンプレート名を入力してください',t.name+'の持ち物');if(!name?.trim())return;data.templates.push({id:uid(),name:name.trim(),items:t.items.map(i=>({id:uid(),name:i.name,category:i.category,checked:false}))});save();activeTab='templates';renderMain()};
 host.querySelector('#exportData').onclick=exportData;
 let list=host.querySelector('#itemList');let shown=t.items.filter(i=>filter==='all'||(filter==='done'?i.checked:!i.checked));
 list.innerHTML=shown.length?shown.map(i=>`<div class="item ${i.checked?'checked':''}"><input type="checkbox" data-check="${i.id}" ${i.checked?'checked':''} aria-label="${esc(i.name)}"><div class="item-main"><div class="item-name">${esc(i.name)}</div><div class="item-sub">${esc(i.category||'その他')}</div></div><span class="category">${i.checked?'準備済み':'未準備'}</span><button class="item-delete" data-delete="${i.id}" title="削除" aria-label="削除">×</button></div>`).join(''):'<div class="empty">表示する持ち物がありません。上から追加できます。</div>';
 list.querySelectorAll('[data-check]').forEach(c=>c.onchange=()=>{let item=t.items.find(i=>i.id===c.dataset.check);if(item)item.checked=c.checked;save()});
 list.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{let item=t.items.find(i=>i.id===b.dataset.delete);if(item&&confirm(`「${item.name}」を削除しますか？`)){t.items=t.items.filter(i=>i.id!==b.dataset.delete);save()}});

function renderTemplates(t){let host=document.getElementById('tabContent');host.innerHTML=`<div class="section-head"><div><h2 style="margin:0 0 4px">保存済みテンプレート</h2><div class="trip-meta">テンプレートを使って持ち物をまとめて追加できます。</div></div></div><div class="template-grid">${data.templates.map(tp=>`<div class="template"><h3>${esc(tp.name)}</h3><p>${tp.items.length}項目 · ${esc(tp.items.slice(0,4).map(i=>i.name).join('、'))}${tp.items.length>4?' ほか':''}</p><div class="template-actions"><button class="secondary small" data-apply="${tp.id}">この旅行に追加</button><button class="plain small" data-replace="${tp.id}">リストを置き換え</button><button class="plain small" data-save="${tp.id}">更新</button><button class="danger small" data-remove="${tp.id}">削除</button></div></div>`).join('')}</div><p class="notice">「追加」は既存の持ち物を残して項目を加えます。「置き換え」は現在のリストを消してから適用します。</p>`;

 host.querySelectorAll('[data-replace]').forEach(b=>b.onclick=()=>{let tp=data.templates.find(x=>x.id===b.dataset.replace);if(tp&&confirm('現在の持ち物リストを置き換えますか？')){t.items=tp.items.map(i=>({id:uid(),name:i.name,category:i.category,checked:false}));save();activeTab='items';renderMain()}});
 host.querySelectorAll('[data-save]').forEach(b=>b.onclick=()=>{let tp=data.templates.find(x=>x.id===b.dataset.save);if(tp&&confirm(`「${tp.name}」を現在の持ち物リストで更新しますか？`)){tp.items=t.items.map(i=>({id:uid(),name:i.name,category:i.category,checked:false}));save();renderMain()}});
 host.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{let tp=data.templates.find(x=>x.id===b.dataset.remove);if(tp&&confirm(`テンプレート「${tp.name}」を削除しますか？`)){data.templates=data.templates.filter(x=>x.id!==tp.id);save()}});

function renderSettings(t){let host=document.getElementById('tabContent');host.innerHTML=`<h2>旅行の管理・出力</h2><p class="trip-meta">旅行情報の編集、プランの共有、PDF保存ができます。</p><div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px"><button class="secondary" id="editSettings">旅行情報を編集</button><button class="primary" id="pdfTrip">PDF出力・印刷</button><button class="secondary" id="shareTrip">旅行プランを共有</button><button class="plain" id="exportText">テキスト保存</button><button class="plain" id="duplicateTrip">この旅行を複製</button><button class="danger" id="deleteTrip">この旅行を削除</button></div><p class="notice">PDF出力は印刷画面から「PDFとして保存」を選びます。共有機能はスマホの共有メニューに対応している場合に利用できます。旅行を削除すると関連データも削除されます。</p>`;
 host.querySelector('#editSettings').onclick=()=>openTripModal(t);host.querySelector('#pdfTrip').onclick=()=>exportPdf(t);host.querySelector('#shareTrip').onclick=()=>shareTrip(t);host.querySelector('#exportText').onclick=()=>downloadText(buildTripText(t),t.name+'-旅行プラン');
 host.querySelector('#duplicateTrip').onclick=()=>{let copy={...t,id:uid(),name:t.name+'（コピー）',items:t.items.map(i=>({...i,id:uid(),checked:false})),schedule:(t.schedule||[]).map(i=>({...i,id:uid()})),expenses:(t.expenses||[]).map(i=>({...i,id:uid()})),places:(t.places||[]).map(i=>({...i,id:uid()})),review:{...(t.review||{})}};data.trips.push(copy);selectedId=copy.id;save()};

function openTripModal(t=null){editingId=t?.id||null;document.getElementById('modalTitle').textContent=t?'旅行を編集':'旅行を追加';document.getElementById('tripName').value=t?.name||'';document.getElementById('tripDestination').value=t?.destination||'';document.getElementById('tripStart').value=t?.start||'';document.getElementById('tripEnd').value=t?.end||'';let sel=document.getElementById('tripTemplate');sel.innerHTML='<option value="">空のリストで作成</option>'+data.templates.map(tp=>`<option value="${tp.id}">${esc(tp.name)}</option>`).join('');sel.disabled=!!t;document.getElementById('tripModal').classList.add('show');if(!t)sel.value=''}
document.getElementById('newTripBtn').onclick=()=>openTripModal();
document.getElementById('cancelTrip').onclick=()=>document.getElementById('tripModal').classList.remove('show');
document.getElementById('tripModal').onclick=e=>{if(e.target.id==='tripModal')e.currentTarget.classList.remove('show')};
document.getElementById('tripForm').onsubmit=e=>{e.preventDefault();let name=document.getElementById('tripName').value.trim();if(!name)return;let obj={name,destination:document.getElementById('tripDestination').value.trim(),start:document.getElementById('tripStart').value,end:document.getElementById('tripEnd').value};if(obj.start&&obj.end&&obj.end<obj.start){alert('帰宅日は出発日以降の日付にしてください。');return}
 if(editingId){Object.assign(data.trips.find(x=>x.id===editingId),obj)}else{let tp=data.templates.find(x=>x.id===document.getElementById('tripTemplate').value);let trip={id:uid(),...obj,budget:0,items:tp?tp.items.map(i=>({id:uid(),name:i.name,category:i.category,checked:false})):[],schedule:[],expenses:[],places:[],review:{rating:0,text:''}};data.trips.push(trip);selectedId=trip.id;activeTab='items';filter='all'}
 document.getElementById('tripModal').classList.remove('show');save()};

function yen(n){return '¥'+(Number(n)||0).toLocaleString('ja-JP')}
function localDate(){return new Date().toISOString().slice(0,10)}
function renderSchedule(t){let host=document.getElementById('tabContent');t.schedule=t.schedule||[];host.innerHTML=`<div class="section-head"><div><h2 style="margin:0 0 4px">旅行スケジュール・行程表</h2><div class="trip-meta">日付、時間、行き先、メモを記録できます。</div></div><button class="secondary small" id="scheduleShare">行程を共有</button></div><form id="scheduleForm"><div class="form-row"><input class="field" id="schDate" type="date" value="${esc(t.start||localDate())}" aria-label="日付" required><input class="field" id="schTime" type="time" aria-label="時間"></div><div class="form-row"><input class="field" id="schTitle" placeholder="予定・行き先（例：金刀比羅宮）" maxlength="100" required><input class="field" id="schDuration" placeholder="滞在時間（例：2時間）" maxlength="40"></div><div class="form-row"><input class="field wide" id="schNote" placeholder="メモ・予約情報・移動方法など" maxlength="300"></div><button class="primary" type="submit">＋ 行程に追加</button></form><div style="margin-top:18px">${t.schedule.length? [...t.schedule].sort((a,b)=>(a.date||'').localeCompare(b.date||'')||(a.time||'').localeCompare(b.time||'')).map(i=>`<div class="data-card"><div style="display:flex;justify-content:space-between;gap:8px;align-items:start"><div><div class="eyebrow">${esc(i.date||'日付未設定')} ${esc(i.time||'')}</div><h3>${esc(i.title)}</h3><div class="data-meta">${i.duration?'⏱ '+esc(i.duration)+'<br>':''}${esc(i.note||'')}</div></div><button class="item-delete" data-schdel="${i.id}" aria-label="行程を削除">×</button></div></div>`).join(''):'<div class="empty">まだ予定がありません。上のフォームから追加できます。</div>'}</div>`;
 host.querySelector('#scheduleForm').onsubmit=e=>{e.preventDefault();t.schedule.push({id:uid(),date:host.querySelector('#schDate').value,time:host.querySelector('#schTime').value,title:host.querySelector('#schTitle').value.trim(),duration:host.querySelector('#schDuration').value.trim(),note:host.querySelector('#schNote').value.trim()});save()};host.querySelectorAll('[data-schdel]').forEach(b=>b.onclick=()=>{t.schedule=t.schedule.filter(i=>i.id!==b.dataset.schdel);save()});host.querySelector('#scheduleShare').onclick=()=>shareTrip(t,'schedule')}
function renderBudget(t){let host=document.getElementById('tabContent');t.expenses=t.expenses||[];let total=t.expenses.reduce((s,x)=>s+(Number(x.amount)||0),0);host.innerHTML=`<h2>旅行費用・予算管理</h2><div class="form-row"><label class="wide" style="font-size:13px;font-weight:700;display:grid;gap:6px">旅行全体の予算<input class="field" id="tripBudget" type="number" min="0" step="1" placeholder="例：50000" value="${Number(t.budget)||''}"></label></div><div class="stats"><div class="stat"><div class="stat-label">予算</div><div class="stat-value">${yen(t.budget)}</div></div><div class="stat"><div class="stat-label">支出合計</div><div class="stat-value">${yen(total)}</div><div class="stat-label" style="margin-top:6px">${t.budget? (total>t.budget?'予算を'+yen(total-t.budget)+'超過':'残り '+yen(t.budget-total)):'予算を設定すると残額を表示'}</div></div></div><form id="expenseForm"><div class="form-row"><input class="field" id="expName" placeholder="支出内容（例：昼食）" maxlength="100" required><input class="field" id="expAmount" type="number" min="0" step="1" placeholder="金額（円）" required></div><div class="form-row"><select class="field" id="expCategory" aria-label="費用の分類"><option>交通費</option><option>宿泊費</option><option>食費</option><option>観光・入場料</option><option>買い物</option><option>その他</option></select><label class="expense-date-field">日付<input class="field" id="expDate" type="date" value="${localDate()}" aria-label="支出日"></label></div><button class="primary" type="submit">＋ 支出を追加</button></form><h3 style="font-size:15px;margin:20px 0 10px">支出一覧</h3>${t.expenses.length?[...t.expenses].sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(x=>`<div class="data-card" style="display:flex;justify-content:space-between;gap:10px;align-items:center"><div><h3>${esc(x.name)}</h3><div class="data-meta">${esc(x.date||'日付なし')} ・ ${esc(x.category||'その他')}</div></div><div style="display:flex;align-items:center;gap:8px"><span class="money">${yen(x.amount)}</span><button class="item-delete" data-expdel="${x.id}" aria-label="支出を削除">×</button></div></div>`).join(''):'<div class="empty">支出はまだ登録されていません。</div>'}`;
 host.querySelector('#tripBudget').onchange=e=>{t.budget=Math.max(0,Number(e.target.value)||0);save()};host.querySelector('#expenseForm').onsubmit=e=>{e.preventDefault();t.expenses.push({id:uid(),name:host.querySelector('#expName').value.trim(),amount:Math.max(0,Number(host.querySelector('#expAmount').value)||0),category:host.querySelector('#expCategory').value,date:host.querySelector('#expDate').value});save()};host.querySelectorAll('[data-expdel]').forEach(b=>b.onclick=()=>{t.expenses=t.expenses.filter(x=>x.id!==b.dataset.expdel);save()})}
function renderPlaces(t){let host=document.getElementById('tabContent');t.places=t.places||[];host.innerHTML=`<h2>行きたい場所リスト・地図</h2><p class="trip-meta">住所や施設名を登録して、地図アプリで場所を確認できます。</p><form id="placeForm"><div class="form-row"><input class="field" id="placeName" placeholder="場所・お店の名前" maxlength="100" required><select class="field" id="placeType"><option>観光</option><option>飲食店</option><option>宿泊</option><option>買い物</option><option>その他</option></select></div><div class="form-row"><input class="field wide" id="placeAddress" placeholder="住所・エリア（例：香川県琴平町）" maxlength="200"></div><div class="form-row"><textarea class="field wide" id="placeNote" rows="2" placeholder="メモ・営業時間・行きたい理由"></textarea></div><button class="primary" type="submit">＋ 行きたい場所に追加</button></form><div style="margin-top:18px">${t.places.length?t.places.map(x=>`<div class="data-card"><div style="display:flex;gap:10px;align-items:start"><input type="checkbox" data-visited="${x.id}" ${x.visited?'checked':''} aria-label="訪問済み" style="width:20px;height:20px;margin-top:2px;accent-color:var(--green)"><div style="flex:1;min-width:0"><div class="eyebrow">${esc(x.type||'その他')} ${x.visited?' · 訪問済み':' · 未訪問'}</div><h3>${esc(x.name)}</h3><div class="data-meta">${esc(x.address||'住所未登録')}<br>${esc(x.note||'')}</div>${x.address||x.name?`<a class="map-link" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent((x.name+' '+(x.address||'')).trim())}" target="_blank" rel="noopener">📍 Googleマップで開く ↗</a>`:''}</div><button class="item-delete" data-placedel="${x.id}" aria-label="場所を削除">×</button></div></div>`).join(''):'<div class="empty">行きたい場所を登録すると、ここに一覧表示されます。</div>'}</div>`;
 host.querySelector('#placeForm').onsubmit=e=>{e.preventDefault();t.places.push({id:uid(),name:host.querySelector('#placeName').value.trim(),type:host.querySelector('#placeType').value,address:host.querySelector('#placeAddress').value.trim(),note:host.querySelector('#placeNote').value.trim(),visited:false});save()};host.querySelectorAll('[data-visited]').forEach(b=>b.onchange=()=>{let x=t.places.find(x=>x.id===b.dataset.visited);if(x)x.visited=b.checked;save()});host.querySelectorAll('[data-placedel]').forEach(b=>b.onclick=()=>{t.places=t.places.filter(x=>x.id!==b.dataset.placedel);save()})}
function renderMemories(t){let host=document.getElementById('tabContent');t.review=t.review||{rating:0,text:''};host.innerHTML=`<h2>旅行の感想・振り返り</h2><p class="trip-meta">旅行後の感想や、次回に活かしたいことを記録できます。</p><label style="display:block;font-size:13px;font-weight:700;margin:16px 0 8px">旅行の満足度</label><div id="ratingStars" style="display:flex;gap:3px;margin-bottom:14px">${[1,2,3,4,5].map(n=>`<button type="button" class="star" data-rate="${n}" aria-label="${n}点">${n<=Number(t.review.rating)?'★':'☆'}</button>`).join('')}</div><label style="display:grid;gap:7px;font-size:13px;font-weight:700">感想・思い出<textarea class="field" id="reviewText" rows="7" maxlength="5000" placeholder="楽しかったこと、よかった場所、次回気をつけたいことなど">${esc(t.review.text||'')}</textarea></label><button class="primary" id="saveReview" style="margin-top:12px">感想を保存</button>`;

   <div class="diary-actions"><button class="plain small" data-diary-share="${x.id}">共有</button><button class="danger small" data-diary-delete="${x.id}">削除</button></div>
  </div></article>`).join(''):'<div class="empty" style="grid-column:1/-1">まだ写真日記がありません。上から写真を追加してください。</div>'}</div>
 <p class="notice">写真は保存容量を抑えるため自動的に縮小されます。ブラウザのデータを消去すると写真も消える場合があります。大切な写真はスマホ本体にも保存してください。</p>`;
 const fileInput=host.querySelector('#diaryPhoto'), preview=host.querySelector('#diaryPreview');
 fileInput.onchange=()=>{
  const f=fileInput.files?.[0]; if(!f){preview.hidden=true;return;}
  if(!f.type.startsWith('image/')){alert('画像ファイルを選択してください。');fileInput.value='';return;}
  const url=URL.createObjectURL(f); preview.src=url; preview.hidden=false;
 };
 host.querySelector('#diaryForm').onsubmit=async e=>{
  e.preventDefault();
  const file=fileInput.files?.[0]; if(!file){alert('写真を選択してください。');return;}
  try{
   const dataUrl=await compressDiaryImage(file);
   t.diary.push({id:uid(),date:host.querySelector('#diaryDate').value,place:host.querySelector('#diaryPlace').value.trim(),text:host.querySelector('#diaryText').value.trim(),photo:dataUrl,createdAt:Date.now()});
   save();
  }catch(err){alert('写真を保存できませんでした。別の写真を選ぶか、画像サイズの小さい写真でお試しください。');}
 };
 host.querySelectorAll('[data-diary-delete]').forEach(b=>b.onclick=()=>{
  const entry=t.diary.find(x=>x.id===b.dataset.diaryDelete);
  if(entry&&confirm('この写真日記を削除しますか？')){t.diary=t.diary.filter(x=>x.id!==entry.id);save();}
 });
 host.querySelectorAll('[data-diary-share]').forEach(b=>b.onclick=async()=>{
  const entry=t.diary.find(x=>x.id===b.dataset.diaryShare); if(!entry)return;
  const text=[t.name,entry.date,entry.place,entry.text].filter(Boolean).join('\\n');
  try{
   if(navigator.share && navigator.canShare && entry.photo.startsWith('data:')){
    const blob=await (await fetch(entry.photo)).blob();
    const file=new File([blob], 'travel-photo.jpg', {type:blob.type||'image/jpeg'});
    if(navigator.canShare({files:[file]})){await navigator.share({title:entry.place||t.name,text,files:[file]});return;}
   }
   if(navigator.share){await navigator.share({title:entry.place||t.name,text});}
   else if(navigator.clipboard?.writeText){await navigator.clipboard.writeText(text);alert('説明文をコピーしました。写真はスマホの共有機能から送ってください。');}
   else{downloadText(text,(entry.place||'旅行の思い出')+'-日記');}
  }catch(err){if(err.name!=='AbortError')alert('共有できませんでした。');}
 });
}
function compressDiaryImage(file){
 return new Promise((resolve,reject)=>{
  const reader=new FileReader();
  reader.onerror=reject;
  reader.onload=()=>{
   const img=new Image(); img.onerror=reject;
   img.onload=()=>{
    const max=1280, scale=Math.min(1,max/Math.max(img.width,img.height));
    const canvas=document.createElement('canvas'); canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));
    const ctx=canvas.getContext('2d'); if(!ctx){reject(new Error('canvas unavailable'));return;}
    ctx.drawImage(img,0,0,canvas.width,canvas.height);
    resolve(canvas.toDataURL('image/jpeg',0.78));
   };
   img.src=reader.result;
  };
  reader.readAsDataURL(file);
 });
}

function buildTripText(t){
  const lines = [t.name, `行き先：${t.destination || '未設定'}`, `日程：${dateRange(t)}`];
  const spent = (t.expenses || []).reduce((sum, x) => sum + (Number(x.amount) || 0), 0);
  lines.push('', '【費用】', `予算：${yen(t.budget)}`, `支出合計：${yen(spent)}`);
  (t.expenses || []).forEach(x => lines.push(`${x.date || ''} ${x.name}：${yen(x.amount)}（${x.category || 'その他'}）`));
  lines.push('', '【行きたい場所】');
  (t.places || []).forEach(x => lines.push(`${x.visited ? '[訪問済]' : '[未訪問]'} ${x.name} ${x.address || ''}${x.note ? ' - ' + x.note : ''}`));
  lines.push('', '【持ち物】');
  (t.items || []).forEach(x => lines.push(`${x.checked ? '[✓]' : '[ ]'} ${x.name}（${x.category || 'その他'}）`));
  lines.push('', '【感想】', `満足度：${t.review?.rating || 0}/5`, t.review?.text || '未記入');
  return lines.join('\n');
}
async function shareTrip(t){
  const text = buildTripText(t);
  try {
    if (navigator.share) await navigator.share({ title: t.name, text });
    else if (navigator.clipboard?.writeText) { await navigator.clipboard.writeText(text); alert('旅行情報をクリップボードにコピーしました。'); }
    else downloadText(text, t.name + '-旅行プラン.txt');
  } catch (e) { if (e.name !== 'AbortError') alert('共有を開始できませんでした。管理・出力タブからPDF出力をお試しください。'); }
}
function downloadText(text,filename){let blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename.replace(/[\\/:*?"<>|]/g,'_')+'.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportPdf(t){let w=window.open('','_blank');if(!w){alert('ポップアップがブロックされました。ブラウザのポップアップを許可して再度お試しください。');return}let text=buildTripText(t);w.document.write(`<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>${esc(t.name)} - 旅行プラン</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#222;line-height:1.7;padding:24px;white-space:pre-wrap}h1{font-size:22px}button{padding:10px 16px}@media print{button{display:none}body{padding:0}}


</style></head><body><button onclick="window.print()">印刷 / PDFとして保存</button><h1>${esc(t.name)} - 旅行プラン</h1><div>${esc(text)}</div><script>window.onload=()=>{}<\/script></body></html>`);w.document.close()}

render();
</script>
